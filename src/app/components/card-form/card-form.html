<div class="form-container">
  <h2 class="form-title">Draft New Custom Player Card</h2>
  
  <form (ngSubmit)="onSubmit()" #cardForm="ngForm" class="card-draft-form">
    
    <div class="form-group">
      <label for="name">Player Name</label>
      <input 
        type="text" 
        id="name" 
        name="name" 
        [(ngModel)]="name" 
        required 
        class="form-input" 
        placeholder="e.g. Ky Kiske"
      />
    </div>

    <div class="form-group">
      <label for="photoUrl">Photo / Image URL</label>
      <input 
        type="text" 
        id="photoUrl" 
        name="photoUrl" 
        [(ngModel)]="photoUrl" 
        required 
        class="form-input" 
        placeholder="https://example.com/player.png"
      />
    </div>

    <div class="form-group">
      <label for="position">Position Tactics</label>
      <select id="position" name="position" [(ngModel)]="position" class="form-select">
        <option value="ST">ST (Striker)</option>
        <option value="LW">LW (Left Wing)</option>
        <option value="RW">RW (Right Wing)</option>
        <option value="CAM">CAM (Attacking Mid)</option>
        <option value="CDM">CDM (Defensive Mid)</option>
        <option value="LM">LM (Left Mid)</option>
        <option value="RM">RM (Right Mid)</option>
        <option value="CB">CB (Center Back)</option>
        <option value="LB">LB (Left Back)</option>
        <option value="RB">RB (Right Back)</option>
        <option value="GK">GK (Goalkeeper)</option>
      </select>
    </div>

    <div class="form-group">
      <label>Overall Evaluation (OVR): <span class="highlight">{{ ovr }}</span></label>
      <input 
        type="range" 
        name="ovr" 
        min="1" 
        max="99" 
        [(ngModel)]="ovr" 
        class="form-range"
      />
    </div>

    <h3 class="attributes-title">Attributes Blueprint</h3>

    @if (position === 'GK') {
      <div class="stats-grid">
        @for (stat of gkKeys; track stat) {
          <div class="form-group">
            <label>{{ stat.toUpperCase() }}</label>
            <input 
              type="number" 
              [name]="stat" 
              min="1" 
              max="99" 
              [(ngModel)]="gkStats[stat]" 
              class="form-input stat-input"
            />
          </div>
        }
      </div>
    } @else {
      <div class="stats-grid">
        @for (stat of outfieldKeys; track stat) {
          <div class="form-group">
            <label>{{ stat.toUpperCase() }}</label>
            <input 
              type="number" 
              [name]="stat" 
              min="1" 
              max="99" 
              [(ngModel)]="outfieldStats[stat]" 
              class="form-input stat-input"
            />
          </div>
        }
      </div>
    }

    <button type="submit" [disabled]="!cardForm.valid" class="submit-btn">
      Forge Player Document
    </button>
  </form>
</div>
